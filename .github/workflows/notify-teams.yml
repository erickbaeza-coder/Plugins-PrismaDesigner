name: Notificar Teams – Nueva versión de Prisma Designer

on:
  release:
    types: [published]

jobs:
  notify:
    name: Build, subir asset y notificar Teams
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build plugin
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VER="${VERSION#v}"
          chmod +x build.sh
          ./build.sh "$VER"

      - name: Subir plugin al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VER="${VERSION#v}"
          gh release upload "$VERSION" "releases/prisma-designer-v${VER}.plugin" --clobber

      - name: Enviar notificación a Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/prisma-designer-${{ github.event.release.tag_name }}.plugin
        run: |
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os

          version = os.environ['VERSION']
          release_url = os.environ['RELEASE_URL']
          download_url = os.environ['DOWNLOAD_URL']
          notes = os.environ.get('NOTES', '') or 'Ver release notes en GitHub'
          repo = os.environ['REPO']

          payload = {
            'type': 'message',
            'attachments': [
              {
                'contentType': 'application/vnd.microsoft.card.adaptive',
                'content': {
                  '$schema': 'http://adaptivecards.io/schemas/adaptive-card.json',
                  'type': 'AdaptiveCard',
                  'version': '1.4',
                  'body': [
                    {
                      'type': 'TextBlock',
                      'text': 'Nueva version de Prisma Designer',
                      'weight': 'Bolder',
                      'size': 'Medium',
                      'color': 'Accent'
                    },
                    {
                      'type': 'TextBlock',
                      'text': f'prisma-designer {version} ya esta disponible',
                      'wrap': True
                    },
                    {
                      'type': 'FactSet',
                      'facts': [
                        {'title': 'Version', 'value': version},
                        {'title': 'Repo', 'value': repo}
                      ]
                    },
                    {
                      'type': 'TextBlock',
                      'text': 'Que hay de nuevo?',
                      'weight': 'Bolder',
                      'spacing': 'Medium'
                    },
                    {
                      'type': 'TextBlock',
                      'text': notes,
                      'wrap': True,
                      'color': 'Default'
                    },
                    {
                      'type': 'TextBlock',
                      'text': 'Como actualizar: Descarga el plugin desde Assets -> Claude -> Configuracion -> Plugins -> Instalar',
                      'wrap': True,
                      'spacing': 'Medium',
                      'isSubtle': True
                    }
                  ],
                  'actions': [
                    {
                      'type': 'Action.OpenUrl',
                      'title': 'Descargar plugin',
                      'url': download_url
                    },
                    {
                      'type': 'Action.OpenUrl',
                      'title': 'Ver release notes',
                      'url': release_url
                    }
                  ]
                }
              }
            ]
          }

          print(json.dumps(payload, ensure_ascii=False))
          PYEOF
          )

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "Error al enviar notificacion a Teams (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Notificacion enviada a Teams correctamente"
