name: Notificar Teams – Nueva versión de Prisma Designer

on:
  release:
    types: [published]

jobs:
  notify:
    name: Enviar notificación a Teams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Actualizar version.json con la nueva versión
        env:
          VERSION: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          DATE=$(date +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/prisma-designer-${CLEAN_VERSION}.plugin"

          export CLEAN_VERSION DATE DOWNLOAD_URL

          python3 << 'PYEOF'
          import json, os

          clean_version = os.environ['CLEAN_VERSION']
          date = os.environ['DATE']
          notes = os.environ.get('NOTES', '')
          download_url = os.environ['DOWNLOAD_URL']

          with open('version.json', 'r') as f:
              data = json.load(f)

          data['version'] = clean_version
          data['release_date'] = date
          data['changelog'] = notes
          data['download_url'] = download_url

          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"✅ version.json actualizado a v{clean_version}")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to ${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Enviar notificación a Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os

          version = os.environ['VERSION']
          release_url = os.environ['RELEASE_URL']
          notes = os.environ.get('NOTES', '') or 'Ver release notes en GitHub'
          repo = os.environ['REPO']

          payload = {
            'type': 'message',
            'attachments': [
              {
                'contentType': 'application/vnd.microsoft.card.adaptive',
                'content': {
                  '$schema': 'http://adaptivecards.io/schemas/adaptive-card.json',
                  'type': 'AdaptiveCard',
                  'version': '1.4',
                  'body': [
                    {
                      'type': 'TextBlock',
                      'text': '🎨 Nueva versión de Prisma Designer',
                      'weight': 'Bolder',
                      'size': 'Medium',
                      'color': 'Accent'
                    },
                    {
                      'type': 'TextBlock',
                      'text': f'**prisma-designer {version}** ya está disponible',
                      'wrap': True
                    },
                    {
                      'type': 'FactSet',
                      'facts': [
                        {'title': 'Versión', 'value': version},
                        {'title': 'Repo', 'value': repo}
                      ]
                    },
                    {
                      'type': 'TextBlock',
                      'text': '**¿Qué hay de nuevo?**',
                      'weight': 'Bolder',
                      'spacing': 'Medium'
                    },
                    {
                      'type': 'TextBlock',
                      'text': notes,
                      'wrap': True,
                      'color': 'Default'
                    },
                    {
                      'type': 'TextBlock',
                      'text': '**Cómo actualizar:** Descarga el .plugin → Claude → Configuración → Plugins → Instalar',
                      'wrap': True,
                      'spacing': 'Medium',
                      'isSubtle': True
                    }
                  ],
                  'actions': [
                    {
                      'type': 'Action.OpenUrl',
                      'title': '📥 Descargar plugin',
                      'url': release_url
                    },
                    {
                      'type': 'Action.OpenUrl',
                      'title': '📋 Ver release notes',
                      'url': release_url
                    }
                  ]
                }
              }
            ]
          }

          print(json.dumps(payload, ensure_ascii=False))
          PYEOF
          )

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "❌ Error al enviar notificación a Teams (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "✅ Notificación enviada a Teams correctamente"
